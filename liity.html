<title>Family Week – Invite</title>
<!--
  Perheen kutsu Family Weekiin. Sovellus lähettää kutsuviestissä tämän sivun osoitteen, koska Viestit ei tee
  arjenapuri://-osoitteesta napautettavaa linkkiä. Jaon tiedot ovat #-osan jälkeen: selain ei lähetä niitä
  palvelimelle, eikä sivu lataa mitään muualta. Painike avaa sovelluksen osoitteella arjenapuri://liity?<sama osa>.
-->
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 520px; margin: 0 auto; padding: 40px 20px 64px; line-height: 1.55; color: #1c1c1e; background: #fafaf8; }
  h1 { font-size: 1.5rem; margin: 0 0 0.4em; }
  p { margin: 0.6em 0; }
  .step { background: #fff; border: 1px solid #e4e4e0; border-radius: 14px; padding: 16px 18px; margin: 14px 0; }
  .step b { display: block; margin-bottom: 8px; }
  a.btn { display: block; text-align: center; text-decoration: none; font-weight: 700; font-size: 1.05rem; border-radius: 999px; padding: 13px 18px; }
  a.primary { background: #2f6e58; color: #fff; }
  a.secondary { border: 2px solid #2f6e58; color: #2f6e58; }
  .note { font-size: 0.9rem; opacity: 0.75; }
  @media (prefers-color-scheme: dark) {
    body { color: #f2f2f2; background: #15151a; }
    .step { background: #1f1f26; border-color: #333; }
    a.secondary { border-color: #7fb8a8; color: #7fb8a8; }
  }
</style>
</head>
<body>
<h1 id="title"></h1>
<p id="intro"></p>
<div class="step"><b id="s1"></b><a class="btn secondary" id="store" href="https://apps.apple.com/app/id6820165594"></a></div>
<div class="step"><b id="s2"></b><a class="btn primary" id="open" href="#"></a></div>
<p class="note" id="note"></p>

    nb: ['Invitasjon til familiens Family Week', 'Du er invitert til familiens felles Family Week.', '1. Last ned appen hvis den ikke allerede er på telefonen', 'Last ned fra App Store', '2. Åpne invitasjonen', 'Åpne invitasjonen i Family Week', 'Hvis knappen ikke gjør noe, last ned appen først og trykk deretter på invitasjonslenken i meldingen igjen.', 'Invitasjonen er ufullstendig. Be om en ny invitasjon.'],

  var nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
  var code = nav.toLowerCase();
  var lang = code.indexOf('pt') === 0 ? (code === 'pt-br' || code === 'pt' ? 'pt' : 'ptPT') : (code.indexOf('no') === 0 || code.indexOf('nn') === 0) ? 'nb' : code.slice(0, 2);
  var t = T[lang] || T.en;
  document.documentElement.lang = lang === 'ptPT' ? 'pt-PT' : lang;
  var ids = ['title', 'intro', 's1', 'store', 's2', 'open', 'note'];
  for (var i = 0; i < ids.length; i++) document.getElementById(ids[i]).textContent = t[i];
  document.title = t[0];
  var hash = location.hash.slice(1);
  var open = document.getElementById('open');
  if (/(^|&)u=/.test(hash)) {
    open.href = 'arjenapuri://liity?' + hash;
  } else {
    open.removeAttribute('href');
    open.style.opacity = '0.4';
    document.getElementById('note').textContent = t[7];
  }
</script>
